name: Build libmpv with CAVS/AVS2 support (Android, dynamic, stripped, optimized)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. libmpv-cavs-dynamic-latest)"
        required: true
        default: "libmpv-cavs-dynamic-latest"

permissions:
  contents: write

env:
  MPV_ANDROID_REF: "2026-04-25"

jobs:
  build:
    name: Build libmpv ${{ matrix.arch.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        arch:
          - { name: arm64-v8a, buildall_arg: arm64 }
          - { name: armeabi-v7a, buildall_arg: armv7l }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config \
            nasm yasm python3-pip git autoconf automake libtool \
            cmake ccache unzip wget curl \
            libssl-dev zlib1g-dev gperf patchelf
          sudo pip3 install --upgrade meson mako
          meson --version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;29.0.14206865" "platform-tools"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Clone mpv-android
        run: |
          git clone --depth 1 --branch ${{ env.MPV_ANDROID_REF }} \
            https://github.com/mpv-android/mpv-android.git
          cd mpv-android
          git submodule update --init --recursive || true

      - name: Download CAVS patches
        run: |
          mkdir -p cavs_patches
          CAVS_PATCHES="d208cf8 48ad875 e633613 fb9a3ec 0de8ee1 4cd3e6d"
          for sha in $CAVS_PATCHES; do
            echo "Downloading CAVS patch $sha..."
            curl -fsSL "https://github.com/llawsxx/FFmpeg/commit/${sha}.patch" \
              -o "cavs_patches/${sha}.patch" || { echo "Failed to download patch $sha"; exit 1; }
          done
          ls -la cavs_patches/

      - name: Patch buildscripts
        run: |
          cd mpv-android/buildscripts

          # === 1. depinfo.sh: add davs2 ===
          sed -i '/^v_libxml2=/a v_davs2=1.7' include/depinfo.sh
          sed -i '/^dep_dav1d=/a dep_davs2=()' include/depinfo.sh
          sed -i 's/dep_ffmpeg=(mbedtls dav1d libxml2)/dep_ffmpeg=(mbedtls dav1d libxml2 davs2)/' include/depinfo.sh

          # === 2. download-deps.sh: add davs2 download ===
          # Clone WITHOUT --depth 1 so version.sh can use git rev-list
          sed -i '/\[ ! -d dav1d \] && git clone/a [ ! -d davs2 ] && git clone --branch 1.7 https://github.com/pkuvcl/davs2.git' include/download-deps.sh

          # === 3. Create scripts/davs2.sh ===
          printf '%s\n' \
            '#!/bin/bash -e' \
            '. ../../include/path.sh' \
            'if [ "$1" == "build" ]; then' \
            '	true' \
            'elif [ "$1" == "clean" ]; then' \
            '	rm -rf _build$ndk_suffix' \
            '	exit 0' \
            'else' \
            '	exit 255' \
            'fi' \
            'export CC="$CXX"' \
            'cd build/linux' \
            './configure \' \
            '	--host=$ndk_triple \' \
            '	--prefix=/ \' \
            '	--enable-shared \' \
            '	--disable-static \' \
            '	--enable-pic \' \
            '	--disable-asm' \
            'make -j$cores lib-shared' \
            'make DESTDIR="$prefix_dir" install-lib-shared' \
            '# Fix .pc file: ensure Version field is correct (version.sh may fail with shallow clone)' \
            'PC_FILE="$prefix_dir/lib/pkgconfig/davs2.pc"' \
            'if [ -f "$PC_FILE" ]; then' \
            '    echo "=== davs2.pc before fix ==="' \
            '    cat "$PC_FILE"' \
            '    if ! grep -q "^Version: 1" "$PC_FILE"; then' \
            '        if grep -q "^Version:" "$PC_FILE"; then' \
            '            sed -i "s/^Version:.*/Version: 1.7.0/" "$PC_FILE"' \
            '        else' \
            '            sed -i "/^Name:/a Version: 1.7.0" "$PC_FILE"' \
            '        fi' \
            '        echo "=== davs2.pc after fix ==="' \
            '        cat "$PC_FILE"' \
            '    fi' \
            'fi' \
            'ls -la "$prefix_dir/lib/libdavs2.so"* "$prefix_dir/lib/pkgconfig/davs2.pc" 2>/dev/null || { echo "ERROR: davs2 build failed"; exit 1; }' \
            > scripts/davs2.sh
          chmod +x scripts/davs2.sh

          # === 4. Patch ffmpeg.sh ===
          sed -i 's/--enable-{jni,mediacodec,mbedtls,libdav1d,libxml2}/--enable-{jni,mediacodec,mbedtls,libdav1d,libxml2,libdavs2}/' scripts/ffmpeg.sh
          sed -i 's/--cc=$CC --pkg-config=pkg-config --nm=llvm-nm/--cc=$CC --pkg-config=pkg-config --nm=llvm-nm --ar=llvm-ar --ranlib=llvm-ranlib --enable-small --optflags=-Os/' scripts/ffmpeg.sh

          # === 4c. Decoder list ===
          # NOTE: --enable-libuavs3d and --enable-libdavs2 are included here
          # because the brace-expansion sed patches are fragile and may not
          # match the fork's ffmpeg.sh. FFmpeg configure processes all flags
          # regardless of order, so placing library flags here is safe.
          printf '%s\n' \
            '	--enable-libuavs3d' \
            '	--enable-libdavs2' \
            '	--disable-decoders' \
            '	--enable-decoder=h264,hevc,mpeg1video,mpeg2video,mpeg4,msmpeg4v1,msmpeg4v2,msmpeg4v3' \
            '	--enable-decoder=h263,h263i,h263p,flv,svq1,svq3,amv' \
            '	--enable-decoder=vp3,vp5,vp6,vp6a,vp6f,vp7,vp8,vp9,av1' \
            '	--enable-decoder=cavs,libdav1d,libdavs2,libuavs3d' \
            '	--enable-decoder=vc1,vc1image,wmv1,wmv2,wmv3,wmv3image' \
            '	--enable-decoder=theora,dvvideo,rawvideo' \
            '	--enable-decoder=mjpeg,jpegls,png,prores,ffv1,huffyuv' \
            '	--enable-decoder=rv10,rv20,rv30,rv40' \
            '	--enable-decoder=4xm,qtrle,cinepak,msrle,msvideo1,utvideo,indeo3,indeo5' \
            '	--enable-decoder=zlib,bzlib' \
            '	--enable-decoder=h264_mediacodec,hevc_mediacodec,mpeg2_mediacodec,mpeg4_mediacodec,vp8_mediacodec,vp9_mediacodec,av1_mediacodec' \
            '	--enable-decoder=aac,aac_latm,mp3,mp2,mp1,ac3,eac3,dca,flac,opus,vorbis,alac' \
            '	--enable-decoder=pcm_s16le,pcm_s24le,pcm_s32le,pcm_s16be,pcm_s24be,pcm_s32be' \
            '	--enable-decoder=pcm_u8,pcm_f32le,pcm_f64le,pcm_s8,pcm_u16le,pcm_u24le,pcm_u32le' \
            '	--enable-decoder=adpcm_ima_wav,adpcm_ms,adpcm_adx,adpcm_swf,g729' \
            '	--enable-decoder=wmav1,wmav2,wmapro,wmalossless,wmavoice,cook,ra_144,ra_288,sipr' \
            '	--enable-decoder=truehd,mlp,atrac3,atrac1,atrac3p' \
            '	--enable-decoder=amrnb,amrwb,g726,g722' \
            '	--enable-decoder=tak,tta,ape,shorten,imc' \
            '	--enable-decoder=av3a' \
            > /tmp/decoders.txt
          sed -i '/--disable-{muxers,encoders,devices}/r /tmp/decoders.txt' scripts/ffmpeg.sh
          echo "=== ffmpeg.sh decoder count ==="
          grep -c "enable-decoder" scripts/ffmpeg.sh

      - name: Download dependencies
        run: |
          cd mpv-android/buildscripts
          export IN_CI=1
          ./download.sh
          echo "=== davs2 source check ==="
          ls -la deps/davs2/build/linux/configure 2>/dev/null || { echo "ERROR: davs2 not found"; exit 1; }

      - name: Patch davs2 source — disable threading + NULL safety
        run: |
          cd mpv-android/buildscripts
          DAVS2_DIR=$(find . -type d -name "davs2" | grep -v ".git" | head -1)
          [ -d "$DAVS2_DIR/source" ] || { echo "ERROR: davs2 source not found"; exit 1; }
          cd "$DAVS2_DIR"

          echo "=== davs2 source files ==="
          find source -name "*.cc" -o -name "*.c" | sort

          cat > /tmp/patch_davs2_source.py << 'SCRIPT_EOF'
          import os, re, sys

          nl = '\n'
          ok = []
          fail = []

          # ===== 1. REPLACE ENTIRE threadpool.cc with synchronous implementation =====
          # THE critical fix — replaces all threadpool functions with synchronous
          # versions that execute work in the calling thread.
          # No pthread_create, no worker threads, no race conditions.
          # API from threadpool.h:
          #   int  davs2_threadpool_init(p_pool, threads, init_func, init_arg1, init_arg2)
          #   void davs2_threadpool_run(pool, func, arg1, arg2, wait_sign)
          #   int  davs2_threadpool_is_free(pool)
          #   void *davs2_threadpool_wait(pool, arg1, arg2)
          #   void davs2_threadpool_delete(pool)
          threadpool_cc = "source/common/threadpool.cc"
          if os.path.exists(threadpool_cc):
              sync_impl = (
                  '/* FORCE_SYNC_THREADPOOL - replaced by build script */' + nl +
                  '/* Synchronous implementation - no threads, no pthread_create */' + nl +
                  '' + nl +
                  '#ifndef FPFX' + nl +
                  '#define FPFX(x) davs2_##x' + nl +
                  '#endif' + nl +
                  '#include "threadpool.h"' + nl +
                  '#include <stdlib.h>' + nl +
                  '#include <string.h>' + nl +
                  '' + nl +
                  'struct davs2_threadpool_t { int dummy; };' + nl +
                  '' + nl +
                  'int davs2_threadpool_init(davs2_threadpool_t **p_pool, int threads,' + nl +
                  '                           davs2_threadpool_func_t init_func,' + nl +
                  '                           void *init_arg1, int init_arg2) {' + nl +
                  '    *p_pool = (davs2_threadpool_t *)calloc(1, sizeof(davs2_threadpool_t));' + nl +
                  '    if (!*p_pool) return -1;' + nl +
                  '    if (init_func) init_func(init_arg1, init_arg2);' + nl +
                  '    return 0;' + nl +
                  '}' + nl +
                  '' + nl +
                  'void davs2_threadpool_run(davs2_threadpool_t *pool,' + nl +
                  '                           davs2_threadpool_func_t func,' + nl +
                  '                           void *arg1, int arg2, int wait_sign) {' + nl +
                  '    if (func) func(arg1, arg2);' + nl +
                  '}' + nl +
                  '' + nl +
                  'int davs2_threadpool_is_free(davs2_threadpool_t *pool) {' + nl +
                  '    return 1;' + nl +
                  '}' + nl +
                  '' + nl +
                  'void *davs2_threadpool_wait(davs2_threadpool_t *pool, void *arg1, int arg2) {' + nl +
                  '    return NULL;' + nl +
                  '}' + nl +
                  '' + nl +
                  'void davs2_threadpool_delete(davs2_threadpool_t *pool) {' + nl +
                  '    if (pool) free(pool);' + nl +
                  '}' + nl
              )
              with open(threadpool_cc, 'w', encoding='latin-1') as f:
                  f.write(sync_impl)
              ok.append("threadpool.cc: REPLACED ENTIRE FILE with sync implementation")
          else:
              fail.append(f"NOT FOUND: {threadpool_cc}")

          # ===== 1b. Patch threadpool.h: remove FPFX macro dependencies =====
          # threadpool.h has macros like:
          #   #define davs2_threadpool_init FPFX(threadpool_init)
          # FPFX is defined in davs2.h which our threadpool.cc may not include.
          # Remove these #define lines so function names are plain identifiers.
          threadpool_h = "source/common/threadpool.h"
          if os.path.exists(threadpool_h):
              with open(threadpool_h, 'r', encoding='latin-1') as f:
                  h_content = f.read()
              h_orig = h_content
              h_content = re.sub(r'#define\s+davs2_threadpool_\w+\s+FPFX\(\w+\)\s*\n', '', h_content)
              if 'FPFX_REMOVED' not in h_content:
                  h_content = '/* FPFX_REMOVED */\n' + h_content
              if h_content != h_orig:
                  with open(threadpool_h, 'w', encoding='latin-1') as f:
                      f.write(h_content)
                  ok.append("threadpool.h: removed FPFX macros + added marker")
              else:
                  ok.append("threadpool.h: already patched")
          else:
              fail.append(f"NOT FOUND: {threadpool_h}")

          # ===== 2. Patch davs2.cc: force param->threads=1 + NULL guards =====
          davs2_cc = "source/common/davs2.cc"
          if os.path.exists(davs2_cc):
              with open(davs2_cc, 'r', encoding='latin-1') as f:
                  content = f.read()
              orig = content

              # 2a. Force param->threads = 1 in davs2_decoder_open
              if 'FORCE_SINGLE_THREAD_IN_DAVS2' not in content:
                  idx = content.find('davs2_decoder_open')
                  if idx >= 0:
                      brace_idx = content.find('{', idx)
                      if brace_idx >= 0:
                          insert_pos = brace_idx + 1
                          force_line = nl + '    if (param) param->threads = 1; /* FORCE_SINGLE_THREAD_IN_DAVS2 */' + nl
                          content = content[:insert_pos] + force_line + content[insert_pos:]
                          ok.append("davs2.cc: force param->threads=1")
                      else:
                          fail.append("davs2.cc: no brace after davs2_decoder_open")
                  else:
                      fail.append("davs2.cc: davs2_decoder_open not found")
              else:
                  ok.append("davs2.cc: already forced param->threads=1")

              # 2b. NULL guards at API entry points
              api_patches = [
                  ('int davs2_decoder_send_packet', '    if (!h || !pkt || !pkt->data || pkt->len <= 0) return DAVS2_ERROR;' + nl),
                  ('int davs2_decoder_recv_frame', '    if (!h) return DAVS2_ERROR;' + nl),
                  ('int davs2_decoder_flush', '    if (!h) return DAVS2_ERROR;' + nl),
                  ('void davs2_decoder_close', '    if (!h) return;' + nl),
              ]
              for func_sig, guard_line in api_patches:
                  if guard_line.strip() not in content:
                      idx = content.find(func_sig)
                      if idx >= 0:
                          brace_idx = content.find('{', idx)
                          if brace_idx >= 0:
                              insert_pos = brace_idx + 1
                              content = content[:insert_pos] + nl + guard_line + content[insert_pos:]
                              ok.append(f"davs2.cc: NULL guard for {func_sig}")
                      else:
                          fail.append(f"davs2.cc: {func_sig} not found")
                  else:
                      ok.append(f"davs2.cc: {func_sig} already guarded")

              # 2c. Protect destroy_dpb calls
              content = content.replace(
                  'destroy_dpb(mgr);',
                  'if (mgr && mgr->dpb != NULL) destroy_dpb(mgr);'
              )

              if content != orig:
                  with open(davs2_cc, 'w', encoding='latin-1') as f:
                      f.write(content)
                  print(f"  Written: {davs2_cc}")

          # ===== 3. Patch decoder.cc: NULL guards + thread pool safety =====
          decoder_cc = "source/common/decoder.cc"
          if os.path.exists(decoder_cc):
              with open(decoder_cc, 'r', encoding='latin-1') as f:
                  content = f.read()
              orig = content

              # 3a. NULL guards
              for func_sig in ['void decoder_close', 'int decoder_decode_frame', 'int decoder_decode_nal']:
                  guard = '    if (h == NULL) return -1;' + nl
                  if func_sig == 'void decoder_close':
                      guard = '    if (h == NULL) return;' + nl
                  if guard.strip() not in content:
                      idx = content.find(func_sig)
                      if idx >= 0:
                          brace_idx = content.find('{', idx)
                          if brace_idx >= 0:
                              insert_pos = brace_idx + 1
                              content = content[:insert_pos] + nl + guard + content[insert_pos:]
                              ok.append(f"decoder.cc: NULL guard for {func_sig}")

              # 3b. Replace threadpool_create calls with NULL (belt-and-suspenders)
              # This ensures even if threadpool.cc patch fails, decoder won't create threads
              if 'FORCE_NULL_THREADPOOL' not in content:
                  content = re.sub(
                      r'(h->\w*threadpool\w*\s*=\s*)threadpool_create\s*\([^)]*\)\s*;',
                      r'\1NULL; /* FORCE_NULL_THREADPOOL */',
                      content
                  )
                  if 'FORCE_NULL_THREADPOOL' in content:
                      ok.append("decoder.cc: threadpool_create calls replaced with NULL")

              if content != orig:
                  with open(decoder_cc, 'w', encoding='latin-1') as f:
                      f.write(content)
                  print(f"  Written: {decoder_cc}")

          # ===== Summary =====
          print(nl + "=== DAVS2 SOURCE PATCH SUMMARY ===")
          for p in ok:
              print(f"  OK:   {p}")
          for p in fail:
              print(f"  FAIL: {p}")

          # Verify critical patches
          critical_checks = [
              ('threadpool.cc replaced', threadpool_cc, 'FORCE_SYNC_THREADPOOL'),
              ('threadpool.h patched', threadpool_h, 'FPFX_REMOVED'),
              ('param->threads forced', davs2_cc, 'FORCE_SINGLE_THREAD_IN_DAVS2'),
          ]
          all_critical = True
          for name, path, marker in critical_checks:
              if os.path.exists(path):
                  with open(path, 'r', encoding='latin-1') as f:
                      v = f.read()
                  if marker in v:
                      print(f"  VERIFIED: {name}")
                  else:
                      print(f"  NOT VERIFIED: {name}")
                      all_critical = False

          if not all_critical:
              print("WARNING: Some critical patches not verified!")
          print("=== DAVS2 SOURCE PATCH DONE ===")
          SCRIPT_EOF

          python3 /tmp/patch_davs2_source.py

          echo "=== davs2 patch verification ==="
          grep -rn "FORCE_SYNC_THREADPOOL\|FORCE_SINGLE_THREAD\|FORCE_NULL_THREADPOOL\|if (!h" source/ 2>/dev/null | head -30

      - name: Patch FFmpeg libdavs2.c wrapper (CRITICAL FIX)
        run: |
          cd mpv-android/buildscripts
          FFMPEG_DIR=""
          for c in deps/ffmpeg sources/ffmpeg; do
            [ -d "$c/libavcodec" ] && FFMPEG_DIR="$c" && break
          done
          if [ -z "$FFMPEG_DIR" ]; then
            FFMPEG_DIR=$(find . -type d -name "ffmpeg" | grep -v ".git" | head -1)
          fi
          [ -d "$FFMPEG_DIR/libavcodec" ] || { echo "ERROR: no FFmpeg"; exit 1; }
          LIBDAVS2_C="$FFMPEG_DIR/libavcodec/libdavs2.c"
          [ -f "$LIBDAVS2_C" ] || { echo "ERROR: libdavs2.c not found"; exit 1; }

          echo "=== Original libdavs2.c key lines ==="
          grep -n "thread_count\|param.threads\|cad->packet.data\|davs2_decoder_send_packet\|davs2_decoder_recv_frame\|DAVS2_ERROR\|can't read\|buf_ptr" "$LIBDAVS2_C" | head -30

          # Write Python patch script to file (avoids YAML heredoc indentation issues)
          cat > /tmp/patch_davs2.py << 'SCRIPT_EOF'
          import sys, os, re

          # Find libdavs2.c
          file_path = ""
          for d in ['deps/ffmpeg', 'sources/ffmpeg']:
              p = os.path.join(d, 'libavcodec', 'libdavs2.c')
              if os.path.exists(p):
                  file_path = p
                  break
          if not file_path:
              import subprocess
              r = subprocess.run(['find', '.', '-name', 'libdavs2.c', '-path', '*/libavcodec/*'],
                                 capture_output=True, text=True)
              file_path = r.stdout.strip().split('\n')[0] if r.stdout.strip() else ""

          if not file_path or not os.path.exists(file_path):
              print("ERROR: libdavs2.c not found")
              sys.exit(1)

          print(f"Patching: {file_path}")
          with open(file_path, 'r', encoding='latin-1') as f:
              content = f.read()

          original = content
          ok = []
          fail = []

          # PATCH 1: Force single-threaded (THE CRITICAL FIX)
          # Actual code: cad->param.threads = avctx->thread_count;
          # Previous bug: searched for 'davs2_default_read_parameters' which doesn't exist!
          old_t = 'cad->param.threads = avctx->thread_count;'
          new_t = 'cad->param.threads = 1; /* FORCE_SINGLE_THREAD: prevent SIGSEGV */'
          if old_t in content:
              content = content.replace(old_t, new_t)
              ok.append("1: Force single-thread (exact match)")
          elif 'FORCE_SINGLE_THREAD' in content:
              ok.append("1: Already applied")
          else:
              content = re.sub(r'cad->param\.threads\s*=\s*[^;]+;', new_t, content)
              if 'FORCE_SINGLE_THREAD' in content:
                  ok.append("1: Force single-thread (regex)")
              else:
                  fail.append("1: Cannot find thread line")

          # PATCH 2: Skip corrupt/empty packets + NULL decoder check
          # Build C code block using string concatenation (YAML-safe)
          nl = '\n'
          corrupt_block = (
              "    /* CRASH_FIX: skip corrupt/empty packets */" + nl +
              "    if (!buf_ptr || buf_size <= 0) {" + nl +
              "        *got_frame = 0;" + nl +
              "        return 0;" + nl +
              "    }" + nl +
              "    if (avpkt->flags & AV_PKT_FLAG_CORRUPT) {" + nl +
              '        av_log(avctx, AV_LOG_WARNING, "Skipping corrupt AVS2 packet\\n");' + nl +
              "        if (cad->decoder)" + nl +
              "            davs2_decoder_flush(cad->decoder, &cad->headerset, &cad->out_frame);" + nl +
              "        *got_frame = 0;" + nl +
              "        return buf_size;" + nl +
              "    }" + nl +
              "    /* NULL_DECODER_CHECK */" + nl +
              "    if (!cad->decoder) {" + nl +
              "        *got_frame = 0;" + nl +
              "        return buf_size;" + nl +
              "    }" + nl +
              "    cad->packet.data = buf_ptr;"
          )
          old_pkt = '    cad->packet.data = buf_ptr;'
          if old_pkt in content and 'CRASH_FIX' not in content:
              content = content.replace(old_pkt, corrupt_block, 1)
              ok.append("2: Corrupt skip + NULL check")
          elif 'CRASH_FIX' in content:
              ok.append("2: Already applied")
          else:
              fail.append("2: Cannot find packet.data line")

          # PATCH 3: Make send_packet error non-fatal
          old_se = (
              "    if (ret == DAVS2_ERROR) {" + nl +
              '        av_log(avctx, AV_LOG_ERROR, "Decoder error: can\'t read packet\\n");' + nl +
              "        return AVERROR_EXTERNAL;" + nl +
              "    }"
          )
          new_se = (
              "    if (ret == DAVS2_ERROR) {" + nl +
              '        av_log(avctx, AV_LOG_WARNING, "Decoder warning: can\'t read packet, flushing\\n");' + nl +
              "        davs2_decoder_flush(cad->decoder, &cad->headerset, &cad->out_frame);" + nl +
              "        *got_frame = 0;" + nl +
              "        return buf_size;" + nl +
              "    }"
          )
          if old_se in content:
              content = content.replace(old_se, new_se, 1)
              ok.append("3: send_packet non-fatal")
          elif "can't read packet, flushing" in content:
              ok.append("3: Already applied")
          else:
              fail.append("3: Cannot find send error block")

          # PATCH 4: recv_frame error recovery
          # IMPORTANT: Do NOT use re.sub for replacement because it processes
          # escape sequences in the replacement string, turning \\n into a real
          # newline instead of the literal \n needed for C code.
          # Instead, use re.search to find the pattern, then str.replace to insert.
          if 'ERROR_RECOVERY' not in content and 'davs2_decoder_recv_frame' in content:
              pattern = re.compile(r'ret\s*=\s*davs2_decoder_recv_frame\([^)]+\)\s*;')
              match = pattern.search(content)
              if match:
                  matched_text = match.group(0)
                  recovery_block = (
                      "\n    /* ERROR_RECOVERY */" + nl +
                      "    if (ret == DAVS2_ERROR) {" + nl +
                      '        av_log(avctx, AV_LOG_WARNING, "davs2 recv_frame error, flushing\\n");' + nl +
                      "        davs2_decoder_flush(cad->decoder, &cad->headerset, &cad->out_frame);" + nl +
                      "        *got_frame = 0;" + nl +
                      "        return buf_size;" + nl +
                      "    }"
                  )
                  content = content.replace(matched_text, matched_text + recovery_block, 1)
                  if 'ERROR_RECOVERY' in content:
                      ok.append("4: recv_frame error recovery")
                  else:
                      fail.append("4: Cannot patch recv_frame")
              else:
                  fail.append("4: Cannot find recv_frame pattern")
          else:
              ok.append("4: Already applied or not needed")

          # PATCH 5: Force avctx->thread_count = 1 in davs2_init (belt-and-suspenders)
          # This ensures FFmpeg itself doesn't try to use multiple threads
          if 'FORCE_AVCX_THREAD_COUNT_1' not in content:
              # Find davs2_init function and add avctx->thread_count = 1 at the beginning
              init_idx = content.find('davs2_init')
              if init_idx >= 0:
                  init_brace = content.find('{', init_idx)
                  if init_brace >= 0:
                      insert_pos = init_brace + 1
                      thread_force = (
                          nl + "    avctx->thread_count = 1; /* FORCE_AVCX_THREAD_COUNT_1 */" + nl
                      )
                      content = content[:insert_pos] + thread_force + content[insert_pos:]
                      ok.append("5: Force avctx->thread_count=1 in davs2_init")
                  else:
                      fail.append("5: No brace after davs2_init")
              else:
                  # Try alternative function name
                  for alt_name in ['ff_davs2_init', 'davs2_decoder_init']:
                      alt_idx = content.find(alt_name)
                      if alt_idx >= 0:
                          alt_brace = content.find('{', alt_idx)
                          if alt_brace >= 0:
                              insert_pos = alt_brace + 1
                              thread_force = (
                                  nl + "    avctx->thread_count = 1; /* FORCE_AVCX_THREAD_COUNT_1 */" + nl
                              )
                              content = content[:insert_pos] + thread_force + content[insert_pos:]
                              ok.append(f"5: Force avctx->thread_count=1 in {alt_name}")
                              break
                  else:
                      fail.append("5: Cannot find davs2_init function")
          else:
              ok.append("5: Already applied")

          # Write
          if content != original:
              with open(file_path, 'w', encoding='latin-1') as f:
                  f.write(content)
              print("=== libdavs2.c PATCHED ===")
          else:
              print("=== WARNING: No changes ===")

          for p in ok:
              print(f"  OK:   {p}")
          for p in fail:
              print(f"  FAIL: {p}")

          # Verify
          with open(file_path, 'r', encoding='latin-1') as f:
              v = f.read()
          checks = [
              ('Single-thread', 'param.threads = 1'),
              ('Corrupt skip', 'CRASH_FIX'),
              ('NULL decoder', 'NULL_DECODER_CHECK'),
              ('Error recovery', 'ERROR_RECOVERY'),
              ('Flush on send error', "can't read packet, flushing"),
              ('Force thread_count', 'FORCE_AVCX_THREAD_COUNT_1'),
          ]
          all_ok = True
          for name, marker in checks:
              if marker in v:
                  print(f"  OK:   {name}")
              else:
                  print(f"  FAIL: {name}")
                  all_ok = False
          if not all_ok:
              print(v[:3000])
              sys.exit(1)
          print("=== ALL PATCHES VERIFIED ===")
          SCRIPT_EOF

          python3 /tmp/patch_davs2.py

          # Force recompilation of libdavs2.c (prevent stale .o cache)
          FFMPEG_DIR=""
          for c in deps/ffmpeg sources/ffmpeg; do
            [ -d "$c/libavcodec" ] && FFMPEG_DIR="$c" && break
          done
          if [ -z "$FFMPEG_DIR" ]; then
            FFMPEG_DIR=$(find . -type d -name "ffmpeg" | grep -v ".git" | head -1)
          fi
          if [ -n "$FFMPEG_DIR" ] && [ -f "$FFMPEG_DIR/libavcodec/libdavs2.c" ]; then
            touch "$FFMPEG_DIR/libavcodec/libdavs2.c"
            echo "Touched libdavs2.c to force recompilation"
          fi

      - name: Apply CAVS patches to FFmpeg
        run: |
          cd mpv-android/buildscripts
          FFMPEG_DIR=""
          for c in deps/ffmpeg sources/ffmpeg; do
            [ -d "$c/libavcodec" ] && FFMPEG_DIR="$c" && break
          done
          if [ -z "$FFMPEG_DIR" ]; then
            FFMPEG_DIR=$(find . -type d -name "ffmpeg" | grep -v ".git" | head -1)
          fi
          [ -d "$FFMPEG_DIR/libavcodec" ] || { echo "ERROR: no FFmpeg"; exit 1; }
          cd "$FFMPEG_DIR"

          PATCHES_DIR="$GITHUB_WORKSPACE/cavs_patches"
          for sha in d208cf8 48ad875 e633613 fb9a3ec 0de8ee1 4cd3e6d; do
            echo "=== Applying $sha ==="
            patch -p1 --batch --forward -i "$PATCHES_DIR/${sha}.patch" || true
          done

          if ! grep -q AV_CODEC_ID_DRA libavcodec/codec_id.h; then
            if grep -q 'AV_CODEC_ID_AHX,' libavcodec/codec_id.h; then
              perl -i -pe 's/(AV_CODEC_ID_AHX,)/$1\n    AV_CODEC_ID_DRA,/' libavcodec/codec_id.h
            elif grep -q 'AV_CODEC_ID_G728,' libavcodec/codec_id.h; then
              perl -i -pe 's/(AV_CODEC_ID_G728,)/$1\n    AV_CODEC_ID_DRA,/' libavcodec/codec_id.h
            else
              echo "ERROR: cannot add DRA"; exit 1
            fi
          fi
          ls -la libavcodec/libcavs* libavcodec/dradec* 2>/dev/null || { echo "ERROR: CAVS patch failed"; exit 1; }

      - name: Build libuavs3d (AVS3 video decoder library)
        run: |
          cd "$GITHUB_WORKSPACE"
          echo "=== Cloning uavs3d ==="
          git clone --depth 1 https://github.com/uavs3/uavs3d.git uavs3d-src

          # Patch: Android/Bionic has pthread built into libc, no -lpthread needed
          echo "=== Patching uavs3d CMakeLists.txt for Android ==="
          # Disable find_package(Threads) entirely
          sed -i 's/find_package(Threads REQUIRED)/#find_package(Threads REQUIRED)/' uavs3d-src/source/CMakeLists.txt
          # Comment out target_link_libraries with pthread
          sed -i 's/target_link_libraries(\${LIBNAME} pthread)/#target_link_libraries(\${LIBNAME} pthread)/' uavs3d-src/source/CMakeLists.txt
          # Remove -lpthread from pkg-config generation
          sed -i 's/-lpthread//' uavs3d-src/source/CMakeLists.txt
          # Fix armv7: Android NDK Clang doesn't support -mfloat-abi=hard, use softfp instead
          sed -i 's/-mfloat-abi=hard/-mfloat-abi=softfp/g' uavs3d-src/source/CMakeLists.txt
          # CRITICAL FIX for armv7: hand-written ARMv7 assembly uses non-PIC relocations
          # (R_ARM_ALU_PC_G0) that Android's lld linker rejects in shared libraries.
          # Force "generic" CPU target so uavs3d uses pure C implementations (no ASM).
          # This only affects armeabi-v7a; arm64-v8a uses its own arm64 ASM block.
          sed -i 's/set(UAVS3D_TARGET_CPU "armv7")/set(UAVS3D_TARGET_CPU "generic")/' uavs3d-src/source/CMakeLists.txt
          # Also disable the test executable build
          sed -i 's/add_subdirectory(test)/#add_subdirectory(test)/' uavs3d-src/CMakeLists.txt
          echo "=== Patched CMakeLists.txt ==="
          grep -n "pthread\|Threads\|mfloat-abi" uavs3d-src/source/CMakeLists.txt || echo "pthread/float-abi patches applied cleanly"
          echo "=== armv7→generic check ==="
          grep -n 'UAVS3D_TARGET_CPU' uavs3d-src/source/CMakeLists.txt

          # Determine NDK toolchain paths
          NDK_TRIPLE=""
          NDK_CMAKE_TRIPLE=""
          case "${{ matrix.arch.name }}" in
            arm64-v8a)    NDK_TRIPLE="aarch64-linux-android"; NDK_CMAKE_TRIPLE="aarch64-linux-android" ;;
            armeabi-v7a)  NDK_TRIPLE="armv7a-linux-androideabi"; NDK_CMAKE_TRIPLE="armv7a-linux-androideabi" ;;
          esac
          NDK_API_LEVEL=21
          ANDROID_TOOLCHAIN="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"

          echo "=== Building uavs3d for ${{ matrix.arch.name }} ==="

          # CRITICAL: Create prefix directory with symlinks that buildall.sh expects.
          # buildall.sh's setup_prefix() only creates usr/local symlinks if prefix dir
          # doesn't exist yet. Our ninja install creates the dir first, causing
          # buildall.sh to skip symlink creation. Without these symlinks, meson-based
          # builds (dav1d, etc.) install pkgconfig files to prefix/usr/local/lib/
          # instead of prefix/lib/, and FFmpeg configure can't find them.
          PREFIX_DIR="$GITHUB_WORKSPACE/mpv-android/buildscripts/prefix/${{ matrix.arch.buildall_arg }}"
          mkdir -p "$PREFIX_DIR/lib/pkgconfig" "$PREFIX_DIR/include"
          [ -L "$PREFIX_DIR/usr" ] || ln -s . "$PREFIX_DIR/usr"
          [ -L "$PREFIX_DIR/local" ] || ln -s . "$PREFIX_DIR/local"

          mkdir -p uavs3d-build && cd uavs3d-build
          cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_TOOLCHAIN" \
            -DANDROID_ABI="${{ matrix.arch.name }}" \
            -DANDROID_PLATFORM="android-${NDK_API_LEVEL}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX_DIR" \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            ../uavs3d-src
          ninja -j$(nproc)
          ninja install

          echo "=== uavs3d installed ==="
          PREFIX_DIR="$GITHUB_WORKSPACE/mpv-android/buildscripts/prefix/${{ matrix.arch.buildall_arg }}"
          ls -la "$PREFIX_DIR/lib/"*uavs3d* 2>/dev/null
          ls -la "$PREFIX_DIR/include/"*uavs3* 2>/dev/null || ls -la "$PREFIX_DIR/include/uavs3d/" 2>/dev/null || true

          # ALWAYS force-fix uavs3d.pc — CMake may generate one with wrong
          # version (from git rev-list on shallow clone) or with -lpthread
          # (which doesn't exist on Android). Overwrite unconditionally.
          PC_FILE="$PREFIX_DIR/lib/pkgconfig/uavs3d.pc"
          mkdir -p "$PREFIX_DIR/lib/pkgconfig"

          # Determine correct include path for uavs3d headers
          UAVS3D_INC_DIR="-I\${includedir}"
          if [ -f "$PREFIX_DIR/include/uavs3d/uavs3d.h" ] && [ ! -f "$PREFIX_DIR/include/uavs3d.h" ]; then
            cp "$PREFIX_DIR/include/uavs3d/uavs3d.h" "$PREFIX_DIR/include/uavs3d.h" 2>/dev/null || true
          fi

          echo "=== Force-writing uavs3d.pc with correct version, prefix path, and no -lpthread ==="
          printf 'prefix=%s\nexec_prefix=${prefix}\nlibdir=${exec_prefix}/lib\nincludedir=${prefix}/include\n\nName: uavs3d\nDescription: AVS3 decoder library\nVersion: 1.2.1\nLibs: -L${libdir} -luavs3d -lm\nCflags: -I${includedir}\n' "$PREFIX_DIR" > "$PC_FILE"
          echo "Final uavs3d.pc:"
          cat "$PC_FILE"

          # Verify: no -lpthread in .pc file
          if grep -q "lpthread" "$PC_FILE"; then
            echo "ERROR: -lpthread still in uavs3d.pc!"
            sed -i 's/ -lpthread//g' "$PC_FILE"
            echo "Fixed uavs3d.pc:"
            cat "$PC_FILE"
          fi

      - name: Verify ffmpeg.sh has libuavs3d and libdavs2 flags
        run: |
          cd mpv-android/buildscripts
          echo "=== Checking ffmpeg.sh for libuavs3d ==="
          grep -n "libuavs3d" scripts/ffmpeg.sh || { echo "ERROR: libuavs3d not found in ffmpeg.sh!"; exit 1; }
          echo "=== Checking ffmpeg.sh for libdavs2 ==="
          grep -n "libdavs2" scripts/ffmpeg.sh || { echo "WARNING: libdavs2 not found in ffmpeg.sh, trying to add it"; }
          echo "=== All enable- flags in ffmpeg.sh ==="
          grep -n 'enable-' scripts/ffmpeg.sh

      - name: Download AV3A decoder library and patch FFmpeg
        run: |
          cd mpv-android/buildscripts
          FFMPEG_DIR=""
          for c in deps/ffmpeg sources/ffmpeg; do
            [ -d "$c/libavcodec" ] && FFMPEG_DIR="$c" && break
          done
          if [ -z "$FFMPEG_DIR" ]; then
            FFMPEG_DIR=$(find . -type d -name "ffmpeg" | grep -v ".git" | head -1)
          fi
          [ -d "$FFMPEG_DIR/libavcodec" ] || { echo "ERROR: no FFmpeg"; exit 1; }

          echo "=== Step 1: Download prebuilt libavs3a_decoder.so ==="
          cd "$GITHUB_WORKSPACE"
          mkdir -p av3a-libs
          case "${{ matrix.arch.name }}" in
            arm64-v8a)
              curl -fsSL "https://github.com/wuxianlin/ijkplayer-av3a/raw/master/ijkplayer-java/jniLibs/arm64-v8a/libavs3a_decoder.so" \
                -o av3a-libs/libavs3a_decoder.so
              ;;
            armeabi-v7a)
              curl -fsSL "https://github.com/wuxianlin/ijkplayer-av3a/raw/master/ijkplayer-java/jniLibs/armeabi-v7a/libavs3a_decoder.so" \
                -o av3a-libs/libavs3a_decoder.so
              ;;
          esac
          ls -lh av3a-libs/libavs3a_decoder.so || { echo "ERROR: Failed to download libavs3a_decoder.so"; exit 1; }

          # Download model.bin (neural network model needed by AV3A decoder at runtime)
          curl -fsSL "https://github.com/wuxianlin/ijkplayer-av3a/raw/master/ijkplayer-example/src/main/assets/model.bin" \
            -o av3a-libs/model.bin || echo "WARNING: model.bin not downloaded"
          ls -lh av3a-libs/model.bin 2>/dev/null || true

          echo "=== Step 1b: Inspect libavs3a_decoder.so symbols ==="
          NM_TOOL="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          if [ -f "$NM_TOOL" ]; then
            echo "--- Dynamic symbols ---"
            "$NM_TOOL" -D av3a-libs/libavs3a_decoder.so 2>/dev/null | grep -iE "Avs3(Alloc|Decode|Destroy|Parse)" || echo "(no matching symbols)"
            echo "--- All exported symbols ---"
            "$NM_TOOL" -D av3a-libs/libavs3a_decoder.so 2>/dev/null | head -50
          else
            echo "nm tool not found, skipping symbol inspection"
          fi

          echo "=== Step 2: Patch FFmpeg to add AV3A codec support ==="
          cd "$GITHUB_WORKSPACE/mpv-android/buildscripts"
          FFMPEG_ABS=$(cd "$FFMPEG_DIR" && pwd)
          echo "FFmpeg dir: $FFMPEG_ABS"

          # 3a. Write av3a_dec.c (FFmpeg AVCodec wrapper)
          cp "$GITHUB_WORKSPACE/av3a_dec.c" "$FFMPEG_ABS/libavcodec/av3a_dec.c"
          echo "Copied av3a_dec.c to libavcodec/"

          # 3b. Add AV_CODEC_ID_AV3A to codec_id.h
          CODEC_ID_H="$FFMPEG_ABS/libavcodec/codec_id.h"
          if ! grep -q "AV_CODEC_ID_AV3A" "$CODEC_ID_H"; then
            if grep -q "AV_CODEC_ID_DRA" "$CODEC_ID_H"; then
              sed -i '/AV_CODEC_ID_DRA/a\    AV_CODEC_ID_AV3A,' "$CODEC_ID_H"
            elif grep -q 'AV_CODEC_ID_AHX,' "$CODEC_ID_H"; then
              sed -i '/AV_CODEC_ID_AHX,/a\    AV_CODEC_ID_AV3A,' "$CODEC_ID_H"
            else
              echo "WARNING: Cannot find insertion point in codec_id.h, adding at end of audio section"
              sed -i '/AV_CODEC_ID_G728,/i\    AV_CODEC_ID_AV3A,' "$CODEC_ID_H"
            fi
            echo "Added AV_CODEC_ID_AV3A to codec_id.h"
          else
            echo "AV_CODEC_ID_AV3A already in codec_id.h"
          fi
          grep -n "AV_CODEC_ID_AV3A" "$CODEC_ID_H" || { echo "ERROR: Failed to add AV_CODEC_ID_AV3A"; exit 1; }

          # 3c. Register decoder in allcodecs.c
          # In FFmpeg n8.0, allcodecs.c only has extern declarations.
          # The codec array is auto-generated in codec_list.c by configure.
          # We only add the extern declaration; configure will discover it
          # and --enable-decoder=av3a will add it to codec_list.c.
          ALLCODECS_C="$FFMPEG_ABS/libavcodec/allcodecs.c"
          if ! grep -q "ff_av3a_decoder" "$ALLCODECS_C"; then
            sed -i '/extern const FFCodec ff_aac_decoder;/a extern const FFCodec ff_av3a_decoder;' "$ALLCODECS_C"
            echo "Added extern ff_av3a_decoder to allcodecs.c"
          else
            echo "ff_av3a_decoder already in allcodecs.c"
          fi
          grep -n "av3a" "$ALLCODECS_C"

          # 3d. Add to Makefile
          MAKEFILE="$FFMPEG_ABS/libavcodec/Makefile"
          if ! grep -q "av3a_dec" "$MAKEFILE"; then
            echo "OBJS-\$(CONFIG_AV3A_DECODER)            += av3a_dec.o" >> "$MAKEFILE"
            echo "Added av3a_dec.o to Makefile"
          fi
          grep "av3a" "$MAKEFILE"

          # 3e. Add FourCC tag mapping for MPEG-TS demuxer
          # The MPEG-TS demuxer resolves codec tags via ff_codec_wav_tags in libavformat/riff.c
          # AV3A FourCC = 'a','v','3','a' = 0x61337661
          RIFF_C="$FFMPEG_ABS/libavformat/riff.c"
          if [ -f "$RIFF_C" ] && ! grep -q "AV_CODEC_ID_AV3A" "$RIFF_C"; then
            # Use hex value directly to avoid quoting issues with MKTAG macro
            perl -i -pe 's/(\{ AV_CODEC_ID_PCM_S16LE,)/    { AV_CODEC_ID_AV3A,         0x61337661 },\n$1/' "$RIFF_C"
            echo "Added AV3A FourCC tag to riff.c"
            grep "AV3A" "$RIFF_C"
          elif [ -f "$RIFF_C" ]; then
            echo "AV3A tag already in riff.c"
          fi
          # Also patch mpegts.c: map AV3A registration descriptor tag to AV_CODEC_ID_AV3A
          # The MPEG-TS demuxer parses registration descriptors (tag 0x05) and sets
          # codec_tag, but does NOT automatically map it to a codec_id.
          # Without this patch, the stream shows as "Unknown: none (av3a / 0x61337661)"
          # and no decoder is selected.
          #
          # CRITICAL: MPEG-TS does not carry sample_rate or channel count for AV3A.
          # FFmpeg's avcodec_open2() rejects audio codecs with sample_rate <= 0
          # BEFORE calling the decoder's init function. So we MUST set sensible
          # defaults here to allow the codec to be opened. The decoder will later
          # probe the actual values from the bitstream in av3a_decode_init().
          MPEGTS_C="$FFMPEG_ABS/libavformat/mpegts.c"
          if [ -f "$MPEGTS_C" ] && ! grep -q "AV_CODEC_ID_AV3A" "$MPEGTS_C"; then
            echo "Patching mpegts.c to add AV3A registration descriptor mapping..."
            # Find the line where codec_tag is set from the registration descriptor
            # and add AV3A tag mapping after it. Use line-number based insertion.
            # The registration descriptor handler sets: st->codecpar->codec_tag = bytestream_get_le32(&p);
            TAG_LINE=$(grep -n 'codec_tag.*bytestream_get_le32' "$MPEGTS_C" | head -1 | cut -d: -f1)
            if [ -n "$TAG_LINE" ]; then
              echo "Found codec_tag assignment at line $TAG_LINE, inserting AV3A mapping..."
              sed -i "${TAG_LINE}a\\
                      if (st->codecpar->codec_tag == 0x61337661) { st->codecpar->codec_id = AV_CODEC_ID_AV3A; st->codecpar->codec_type = AVMEDIA_TYPE_AUDIO; st->codecpar->sample_rate = 48000; st->codecpar->format = AV_SAMPLE_FMT_S16; av_channel_layout_default(\&st->codecpar->ch_layout, 2); }" "$MPEGTS_C"
            else
              echo "WARNING: Could not find codec_tag assignment in mpegts.c, trying alternative pattern..."
              # Try alternative: search for registration_descriptor comment
              REG_LINE=$(grep -n 'registration_descriptor' "$MPEGTS_C" | head -1 | cut -d: -f1)
              if [ -n "$REG_LINE" ]; then
                echo "Found registration_descriptor at line $REG_LINE, inserting AV3A mapping after case block..."
                # Insert after the case line — the next lines will contain the codec_tag assignment
                # We add a fallback that checks for the tag after the case block
                sed -i "${REG_LINE}a\\
                    { if (st->codecpar->codec_tag == 0x61337661) { st->codecpar->codec_id = AV_CODEC_ID_AV3A; st->codecpar->codec_type = AVMEDIA_TYPE_AUDIO; st->codecpar->sample_rate = 48000; st->codecpar->format = AV_SAMPLE_FMT_S16; av_channel_layout_default(\&st->codecpar->ch_layout, 2); } }" "$MPEGTS_C"
              fi
            fi
            if grep -q "AV_CODEC_ID_AV3A" "$MPEGTS_C"; then
              echo "✓ Successfully patched mpegts.c with AV3A registration descriptor mapping (with default sample_rate=48000, stereo)"
              grep -n "AV3A" "$MPEGTS_C"
            else
              echo "ERROR: Failed to patch mpegts.c with AV3A mapping!"
              echo "This will cause AV3A audio to not be recognized in MPEG-TS streams."
            fi
          elif [ -f "$MPEGTS_C" ]; then
            echo "AV3A mapping already present in mpegts.c"
            # Check if sample_rate default is already set, if not add it
            if ! grep -q "sample_rate.*48000.*AV3A\|AV3A.*sample_rate.*48000" "$MPEGTS_C"; then
              echo "Adding sample_rate default to existing AV3A mapping..."
              sed -i 's/st->codecpar->codec_type = AVMEDIA_TYPE_AUDIO; }/st->codecpar->codec_type = AVMEDIA_TYPE_AUDIO; st->codecpar->sample_rate = 48000; st->codecpar->format = AV_SAMPLE_FMT_S16; av_channel_layout_default(\&st->codecpar->ch_layout, 2); }/g' "$MPEGTS_C"
              grep -n "AV3A" "$MPEGTS_C"
            fi
          fi

          # 3e2. Patch decode.c: allow AV3A to open with sample_rate=0
          # FFmpeg's ff_decode_preinit() (in libavcodec/decode.c) or avcodec_open2()
          # (in libavcodec/avcodec.c) rejects audio codecs with sample_rate <= 0.
          # This happens BEFORE the decoder's init() is called, so our av3a_decode_init()
          # never gets a chance to set the sample_rate. We insert a default for AV3A
          # before the check so the codec can be opened.
          echo "=== Patching decode.c/avcodec.c for AV3A sample_rate default ==="
          for DECODE_SRC in "$FFMPEG_ABS/libavcodec/decode.c" "$FFMPEG_ABS/libavcodec/avcodec.c"; do
            if [ -f "$DECODE_SRC" ] && grep -q "Invalid sample rate" "$DECODE_SRC" && ! grep -q "AV_CODEC_ID_AV3A" "$DECODE_SRC"; then
              echo "Found 'Invalid sample rate' check in $DECODE_SRC"
              # Find the line with "Invalid sample rate" and look backwards for the if condition
              ERR_LINE=$(grep -n "Invalid sample rate" "$DECODE_SRC" | head -1 | cut -d: -f1)
              echo "Error message at line $ERR_LINE, searching for if condition..."
              FOUND=0
              for offset in 1 2 3 4; do
                CHECK_LINE=$((ERR_LINE - offset))
                [ "$CHECK_LINE" -lt 1 ] && break
                LINE_CONTENT=$(sed -n "${CHECK_LINE}p" "$DECODE_SRC")
                if echo "$LINE_CONTENT" | grep -qE 'if.*sample_rate'; then
                  echo "Found sample_rate check at line $CHECK_LINE: $LINE_CONTENT"
                  # Insert a default before the if line
                  sed -i "${CHECK_LINE}i\\
                          if (avctx->codec_id == AV_CODEC_ID_AV3A \&\& avctx->sample_rate <= 0) avctx->sample_rate = 48000;" "$DECODE_SRC"
                  echo "✓ Inserted AV3A default sample_rate before check"
                  FOUND=1
                  break
                fi
              done
              if [ "$FOUND" -eq 0 ]; then
                echo "WARNING: Could not find if condition for sample_rate check, trying direct replacement..."
                # Fallback: directly modify the condition
                sed -i 's/avctx->sample_rate <= 0)/avctx->sample_rate <= 0 \&\& avctx->codec_id != AV_CODEC_ID_AV3A)/g' "$DECODE_SRC"
                echo "Applied direct condition modification"
              fi
              # Verify
              if grep -q "AV_CODEC_ID_AV3A" "$DECODE_SRC"; then
                echo "✓ Successfully patched $DECODE_SRC for AV3A sample_rate"
                grep -n "AV3A" "$DECODE_SRC"
              else
                echo "ERROR: Failed to patch $DECODE_SRC"
              fi
            elif [ -f "$DECODE_SRC" ] && grep -q "AV_CODEC_ID_AV3A" "$DECODE_SRC"; then
              echo "AV3A patch already present in $DECODE_SRC"
            fi
          done

          # 3f. Add codec descriptor
          CODEC_DESC_C="$FFMPEG_ABS/libavcodec/codec_desc.c"
          if [ -f "$CODEC_DESC_C" ] && ! grep -q "AV_CODEC_ID_AV3A" "$CODEC_DESC_C"; then
            # Add codec descriptor using designated initializers (FFmpeg n8.0 style)
            # Insert before the subtitle codecs section sentinel
            perl -i -pe 'if (/AV_CODEC_ID_FIRST_SUBTITLE/) { $_ = qq(    {\n        .id         = AV_CODEC_ID_AV3A,\n        .type       = AVMEDIA_TYPE_AUDIO,\n        .name       = "av3a",\n        .long_name  = NULL_IF_CONFIG_SMALL("AVS3-P3 Audio Vivid (AV3A)"),\n        .props      = AV_CODEC_PROP_LOSSY,\n    },\n) . $_; }' "$CODEC_DESC_C" 2>/dev/null
            if grep -q "AV_CODEC_ID_AV3A" "$CODEC_DESC_C"; then
              echo "Added AV3A codec descriptor (designated initializers)"
            else
              echo "WARNING: Could not add AV3A codec descriptor, trying alternative"
              sed -i '/AV_CODEC_ID_NONE,/i\    { .id = AV_CODEC_ID_AV3A, .type = AVMEDIA_TYPE_AUDIO, .name = "av3a", .long_name = NULL_IF_CONFIG_SMALL("AVS3-P3 Audio Vivid (AV3A)"), .props = AV_CODEC_PROP_LOSSY },' "$CODEC_DESC_C" 2>/dev/null || true
            fi
          fi

          echo "=== Step 4: Update ffmpeg.sh to enable AV3A decoder ==="
          cd "$GITHUB_WORKSPACE/mpv-android/buildscripts"
          # Add av3a to the audio decoder list
          if ! grep -q "av3a" scripts/ffmpeg.sh; then
            sed -i 's/vorbis,alac/vorbis,alac,av3a/' scripts/ffmpeg.sh
          fi
          # No ldflags changes needed — av3a_dec.c uses dlopen/dlsym at runtime
          echo "=== ffmpeg.sh AV3A configuration ==="
          grep -n "av3a" scripts/ffmpeg.sh

          echo "=== Step 5: Verify avs3 decoder is enabled ==="
          if grep -q "avs3" scripts/ffmpeg.sh; then
            echo "✓ avs3 decoder is enabled in ffmpeg.sh"
            grep "avs3" scripts/ffmpeg.sh
          else
            echo "⚠ WARNING: avs3 decoder NOT found in ffmpeg.sh!"
            echo "Current decoder list:"
            grep "enable-decoder" scripts/ffmpeg.sh | head -20
          fi

          echo "=== AV3A support integration complete ==="

      - name: Verify dependencies before FFmpeg build
        run: |
          cd mpv-android/buildscripts
          PREFIX_DIR=""
          for d in "prefix/${{ matrix.arch.buildall_arg }}" "prefix/arm64" "prefix/armv7l"; do
            if [ -d "$d/lib" ]; then
              PREFIX_DIR="$d"
              break
            fi
          done
          [ -z "$PREFIX_DIR" ] && { echo "ERROR: prefix dir not found"; exit 1; }
          echo "=== Prefix: $PREFIX_DIR ==="
          echo "=== pkg-config files ==="
          ls -la "$PREFIX_DIR/lib/pkgconfig/"*.pc 2>/dev/null || echo "No .pc files found!"
          echo "=== dav1d check ==="
          if [ -f "$PREFIX_DIR/lib/pkgconfig/dav1d.pc" ]; then
            cat "$PREFIX_DIR/lib/pkgconfig/dav1d.pc"
          else
            echo "NOTE: dav1d.pc not found yet — dav1d is built by buildall.sh later, this is expected."
          fi
          echo "=== uavs3d check ==="
          if [ -f "$PREFIX_DIR/lib/pkgconfig/uavs3d.pc" ]; then
            cat "$PREFIX_DIR/lib/pkgconfig/uavs3d.pc"
          else
            echo "WARNING: uavs3d.pc not found"
          fi
          echo "=== All .so files in prefix ==="
          ls -la "$PREFIX_DIR/lib/"*.so* 2>/dev/null || echo "No .so files"

      - name: Build libmpv
        run: |
          cd mpv-android/buildscripts
          export IN_CI=1
          ./buildall.sh --arch ${{ matrix.arch.buildall_arg }} mpv
          find . -name "*.so" -ls 2>/dev/null || true

      - name: Verify decoder support in built libavcodec.so
        run: |
          cd mpv-android/buildscripts
          PREFIX_LIB=""
          for d in "prefix/${{ matrix.arch.buildall_arg }}/lib" "prefix/arm64/lib" "prefix/armv7l/lib"; do
            if [ -d "$d" ] && ls "$d"/*.so 1>/dev/null 2>&1; then
              PREFIX_LIB="$d"
              break
            fi
          done
          [ -z "$PREFIX_LIB" ] && { echo "WARNING: No prefix lib dir found, skipping verification"; exit 0; }
          AVCODEC_SO="$PREFIX_LIB/libavcodec.so"
          [ -f "$AVCODEC_SO" ] || { echo "WARNING: libavcodec.so not found, skipping verification"; exit 0; }

          # Find FFmpeg source dir for config.h verification
          FFMPEG_DIR=""
          for c in deps/ffmpeg sources/ffmpeg; do
            [ -f "$c/ffbuild/config.mak" ] && FFMPEG_DIR="$c" && break
          done

          echo "=== Verifying AVS3 decoder via FFmpeg config.h ==="
          CONFIG_H=""
          if [ -n "$FFMPEG_DIR" ]; then
            # FFmpeg generates config.h in the build dir or source dir
            for f in "$FFMPEG_DIR/config.h" "$FFMPEG_DIR/ffbuild/config.h"; do
              [ -f "$f" ] && CONFIG_H="$f" && break
            done
          fi
          if [ -n "$CONFIG_H" ]; then
            echo "Checking $CONFIG_H"
            if grep -q "CONFIG_LIBUVS3D_DECODER 1" "$CONFIG_H"; then
              echo "✓ CONFIG_LIBUVS3D_DECODER=1 — AVS3 decoder is enabled"
            else
              echo "ERROR: CONFIG_LIBUVS3D_DECODER is NOT 1 in config.h!"
              echo "=== Dumping uavs3d lines from config.h ==="
              grep -i "uavs3d\|avs3" "$CONFIG_H" || echo "(no uavs3d/avs3 lines found)"
              echo "=== Dumping config.log for uavs3d ==="
              if [ -f "$FFMPEG_DIR/ffbuild/config.log" ]; then
                grep -i "uavs3d\|libuavs3d" "$FFMPEG_DIR/ffbuild/config.log" | tail -20
              fi
              exit 1
            fi
          else
            echo "WARNING: config.h not found, falling back to binary check"
            if nm -D "$AVCODEC_SO" 2>/dev/null | grep -i "uavs3d" || strings "$AVCODEC_SO" | grep -i "libuavs3d_decoder\|ff_libuavs3d"; then
              echo "✓ libuavs3d decoder symbol found"
            else
              echo "ERROR: libuavs3d decoder NOT found!"
              exit 1
            fi
          fi
          echo "--- av3a decoder ---"
          if [ -n "$CONFIG_H" ]; then
            if grep -q "CONFIG_AV3A_DECODER 1" "$CONFIG_H"; then
              echo "✓ CONFIG_AV3A_DECODER=1 — AV3A decoder is enabled"
            else
              echo "ERROR: CONFIG_AV3A_DECODER is NOT 1 in config.h!"
              echo "=== Dumping av3a lines from config.h ==="
              grep -i "av3a" "$CONFIG_H" || echo "(no av3a lines found in config.h)"
              echo "=== Checking allcodecs.c for av3a ==="
              grep -i "av3a" "$FFMPEG_DIR/libavcodec/allcodecs.c" || echo "(no av3a in allcodecs.c)"
              echo "=== Checking Makefile for av3a ==="
              grep -i "av3a" "$FFMPEG_DIR/libavcodec/Makefile" || echo "(no av3a in Makefile)"
              echo "=== Checking ffmpeg.sh for av3a decoder ==="
              grep -i "av3a" scripts/ffmpeg.sh || echo "(no av3a in ffmpeg.sh)"
              exit 1
            fi
          else
            if nm -D "$AVCODEC_SO" 2>/dev/null | grep -i "av3a" || strings "$AVCODEC_SO" | grep -i "ff_av3a_decoder"; then
              echo "✓ av3a decoder symbol found"
            else
              echo "ERROR: av3a decoder NOT found!"
              exit 1
            fi
          fi
          echo "--- cavs decoder ---"
          if nm -D "$AVCODEC_SO" 2>/dev/null | grep -i "cavs" || strings "$AVCODEC_SO" | grep -i "cavs"; then
            echo "✓ cavs decoder found in libavcodec.so"
          else
            echo "⚠ WARNING: cavs decoder NOT found in libavcodec.so!"
          fi
          echo "--- davs2 decoder ---"
          if nm -D "$AVCODEC_SO" 2>/dev/null | grep -i "davs2" || strings "$AVCODEC_SO" | grep -i "davs2"; then
            echo "✓ davs2 decoder found in libavcodec.so"
          else
            echo "⚠ WARNING: davs2 decoder NOT found in libavcodec.so!"
          fi

      - name: Collect and strip all .so files
        run: |
          cd mpv-android/buildscripts
          mkdir -p "artifacts/${{ matrix.arch.name }}"
          STRIP_TOOL="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"

          PREFIX_LIB=""
          for d in "prefix/${{ matrix.arch.buildall_arg }}/lib" "prefix/arm64/lib" "prefix/armv7l/lib"; do
            if [ -d "$d" ] && ls "$d"/*.so 1>/dev/null 2>&1; then
              PREFIX_LIB="$d"
              break
            fi
          done

          if [ -z "$PREFIX_LIB" ]; then
            echo "ERROR: no .so files found in prefix"
            find . -name "*.so" -ls | head -30
            exit 1
          fi

          echo "=== Collecting .so from $PREFIX_LIB ==="
          for so in "$PREFIX_LIB"/*.so; do
            [ -f "$so" ] || continue
            base=$(basename "$so")
            echo "--- $base ---"
            echo "Before strip: $(ls -lh "$so" | awk '{print $5}')"
            if [ -f "$STRIP_TOOL" ]; then
              "$STRIP_TOOL" --strip-all "$so" 2>/dev/null || true
              echo "After strip:  $(ls -lh "$so" | awk '{print $5}')"
            fi
            cp -L "$so" "artifacts/${{ matrix.arch.name }}/"
          done

          if [ -f "$PREFIX_LIB/libdavs2.so" ]; then
            echo "libdavs2.so collected"
          else
            echo "WARNING: libdavs2.so not found in $PREFIX_LIB"
            find . -name "libdavs2.so" -ls 2>/dev/null || true
          fi

          # === Copy AV3A decoder .so and model.bin ===
          if [ -f "$GITHUB_WORKSPACE/av3a-libs/libavs3a_decoder.so" ]; then
            cp "$GITHUB_WORKSPACE/av3a-libs/libavs3a_decoder.so" "artifacts/${{ matrix.arch.name }}/"
            echo "Copied libavs3a_decoder.so to artifacts"
          else
            echo "WARNING: libavs3a_decoder.so not found!"
          fi
          if [ -f "$GITHUB_WORKSPACE/av3a-libs/model.bin" ]; then
            mkdir -p "artifacts/${{ matrix.arch.name }}/assets"
            cp "$GITHUB_WORKSPACE/av3a-libs/model.bin" "artifacts/${{ matrix.arch.name }}/assets/model.bin"
            echo "Copied AV3A model.bin to artifacts"
          else
            echo "Note: model.bin not found"
          fi

          # === Fix versioned SONAME in libdavs2.so ===
          DAVS2_SO="artifacts/${{ matrix.arch.name }}/libdavs2.so"
          AVCODEC_SO="artifacts/${{ matrix.arch.name }}/libavcodec.so"
          if [ -f "$DAVS2_SO" ]; then
            OLD_SONAME=$(patchelf --print-soname "$DAVS2_SO" 2>/dev/null || echo "")
            echo "libdavs2.so current SONAME: '$OLD_SONAME'"
            if [ "$OLD_SONAME" != "libdavs2.so" ]; then
              patchelf --set-soname libdavs2.so "$DAVS2_SO"
              echo "Patched libdavs2.so SONAME -> libdavs2.so"
            fi
          fi
          if [ -f "$AVCODEC_SO" ]; then
            NEEDED=$(patchelf --print-needed "$AVCODEC_SO" 2>/dev/null | grep davs2 || echo "")
            echo "libavcodec.so davs2 NEEDED: '$NEEDED'"
            if echo "$NEEDED" | grep -q "libdavs2.so.16"; then
              patchelf --replace-needed libdavs2.so.16 libdavs2.so "$AVCODEC_SO"
              echo "Patched libavcodec.so NEEDED: libdavs2.so.16 -> libdavs2.so"
            fi
          fi

          # === Fix libuavs3d.so SONAME if needed ===
          UAVS3D_SO="artifacts/${{ matrix.arch.name }}/libuavs3d.so"
          if [ -f "$UAVS3D_SO" ]; then
            OLD_SONAME=$(patchelf --print-soname "$UAVS3D_SO" 2>/dev/null || echo "")
            echo "libuavs3d.so current SONAME: '$OLD_SONAME'"
            if [ "$OLD_SONAME" != "libuavs3d.so" ]; then
              patchelf --set-soname libuavs3d.so "$UAVS3D_SO"
              echo "Patched libuavs3d.so SONAME -> libuavs3d.so"
            fi
          else
            echo "WARNING: libuavs3d.so not found in artifacts!"
            find "$GITHUB_WORKSPACE/mpv-android/buildscripts/prefix" -name "*uavs3d*" -ls 2>/dev/null || true
          fi

          echo "=== Final artifacts ==="
          ls -lh "artifacts/${{ matrix.arch.name }}/"
          echo "=== SONAME/NEEDED verification ==="
          for so in "artifacts/${{ matrix.arch.name }}"/*.so; do
            base=$(basename "$so")
            soname=$(patchelf --print-soname "$so" 2>/dev/null || echo "N/A")
            needed=$(patchelf --print-needed "$so" 2>/dev/null | grep davs2 || echo "")
            echo "  $base: SONAME=$soname  davs2_NEEDED=$needed"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-cavs-android-${{ matrix.arch.name }}
          path: mpv-android/buildscripts/artifacts/${{ matrix.arch.name }}/
          retention-days: 7

  release:
    name: Package and upload
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: libmpv-cavs-android-*
          path: artifacts
          merge-multiple: false

      - name: Package
        run: |
          mkdir -p release/jniLibs
          for arch in arm64-v8a armeabi-v7a; do
            DIR="artifacts/libmpv-cavs-android-$arch"
            if [ -d "$DIR" ]; then
              mkdir -p "release/jniLibs/$arch"
              cp "$DIR"/*.so "release/jniLibs/$arch/"
              echo "=== $arch ==="
              ls -la "release/jniLibs/$arch/"
            fi
          done
          # Copy AV3A model.bin to release
          for arch in arm64-v8a armeabi-v7a; do
            DIR="artifacts/libmpv-cavs-android-$arch"
            if [ -d "$DIR/assets" ]; then
              mkdir -p "release/assets"
              cp "$DIR/assets/"* "release/assets/" 2>/dev/null || true
              echo "Copied assets from $arch"
              break
            fi
          done
          for arch in arm64-v8a armeabi-v7a; do
            [ -f "release/jniLibs/$arch/libmpv.so" ] || { echo "ERROR: missing $arch libmpv.so"; exit 1; }
            [ -f "release/jniLibs/$arch/libavcodec.so" ] || { echo "ERROR: missing $arch libavcodec.so"; exit 1; }
            [ -f "release/jniLibs/$arch/libdavs2.so" ] || { echo "ERROR: missing $arch libdavs2.so"; exit 1; }
          done
          cd release
          if [ -d assets ]; then
            tar czf libmpv-cavs-android-dynamic.tar.gz jniLibs assets
          else
            tar czf libmpv-cavs-android-dynamic.tar.gz jniLibs
          fi
          ls -lh libmpv-cavs-android-dynamic.tar.gz

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: release/libmpv-cavs-android-dynamic.tar.gz
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
